name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: docker compose up --build -d

      - name: Wait for the site and the emulator
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null \
              && curl -fsS -o /dev/null -X DELETE "http://127.0.0.1:9000/dados.json?ns=raven-traveler"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - run: npx playwright test

      - if: failure()
        run: docker compose logs

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
