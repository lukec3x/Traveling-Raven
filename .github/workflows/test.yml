name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: supabase start

      - run: docker compose up -d

      - name: Wait for the site and the database
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null \
              && curl -s -o /dev/null --connect-timeout 2 http://127.0.0.1:54321/rest/v1/; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker ps
          exit 1

      - run: npx playwright test

      - if: failure()
        run: docker compose logs

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
